name: Validate legal content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run manifest:refresh
      - run: npm run validate
      - run: npm run validate:enhancements
      - run: npm run test:relationships
      - run: npm run verify:fv005-fv010
      - run: npm run verify:fv011
      - run: npm run verify:fv012
