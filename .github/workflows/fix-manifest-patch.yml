name: Fix content manifest from patch
on:
  workflow_dispatch:
  push:
    paths:
      - 'manifests/registration-manifest.patch'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch manifest
        run: |
          git show a7afc9d0bbb9a82a91142cf15017387664c40895:manifests/content-manifest.json > manifests/content-manifest.json
          patch -p1 < manifests/registration-manifest.patch
          python3 -c "import json; m=json.load(open('manifests/content-manifest.json')); assert len(m['entities'])==603; assert any('registration' in e['id'] for e in m['entities']); print('ok', len(m['entities']))"
          rm -f manifests/registration-manifest.patch
          rm -f .github/workflows/fix-manifest-patch.yml
          rm -f .github/workflows/inflate-manifest.yml
          rm -f manifests/content-manifest.json.z64 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate content-manifest for Registration Act 1908 working set"
          git push
