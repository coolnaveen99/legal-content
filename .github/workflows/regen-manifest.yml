name: Regenerate content manifest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/regen-manifest.yml'
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run manifest
      - name: Assert HMA working set in manifest
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('manifests/content-manifest.json'))
          ids = {e['id'] for e in m['entities']}
          need = [
            'source:india:india-code-hma-1955',
            'collection:india:hma-complete',
            'topic:india:hma-s-9',
            'topic:india:hma-s-13',
            'topic:india:hma-s-13b',
            'topic:india:hma-s-24',
            'topic:india:hma-s-25',
            'provision:india:hma-s-9',
            'provision:india:hma-s-13',
            'provision:india:hma-s-13b',
            'provision:india:hma-s-24',
            'provision:india:hma-s-25',
          ]
          missing = [i for i in need if i not in ids]
          assert not missing, missing
          assert len(m['entities']) >= 625, len(m['entities'])
          print('ok', len(m['entities']), 'entities; HMA set present')
          PY
      - name: Cleanup temp artifacts and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/regen-manifest.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Regenerate content-manifest for Family Law HMA 1955 working set"
          git push
