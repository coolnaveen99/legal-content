name: Inflate content manifest
on:
  push:
    paths:
      - 'manifests/content-manifest.json.z64'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inflate manifest
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, unlinkSync, existsSync } = require('fs');
          const { inflateSync } = require('zlib');
          const zpath = 'manifests/content-manifest.json.z64';
          const z64 = readFileSync(zpath, 'utf8').trim();
          const out = inflateSync(Buffer.from(z64, 'base64')).toString('utf8');
          JSON.parse(out); // sanity
          writeFileSync('manifests/content-manifest.json', out);
          unlinkSync(zpath);
          if (existsSync('.github/workflows/inflate-manifest.yml')) {
            unlinkSync('.github/workflows/inflate-manifest.yml');
          }
          console.log('wrote manifests/content-manifest.json bytes', out.length);
          NODE
      - name: Commit inflated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A manifests/content-manifest.json manifests/content-manifest.json.z64 .github/workflows/inflate-manifest.yml || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Regenerate content-manifest for Registration Act 1908 working set"
          git push
