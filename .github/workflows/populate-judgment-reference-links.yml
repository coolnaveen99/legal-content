name: Populate Judgment Reference Links

on:
  push:
    branches: [main]
    paths:
      - 'judgments/sc/**'
      - 'scripts/populate-judgment-reference-links.py'
      - '.github/workflows/populate-judgment-reference-links.yml'

permissions:
  contents: write

jobs:
  populate:
    if: !contains(github.event.head_commit.message, '[reference-links-bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb

      - name: Populate evidence-backed reference links
        run: python scripts/populate-judgment-reference-links.py

      - name: Commit populated links
        run: |
          if git diff --quiet -- judgments/sc; then
            echo "No pending judgment records needed reference-link updates."
            exit 0
          fi
          git config user.name "codepackr-law-reference-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add judgments/sc
          git commit -m "chore: populate judgment reference links [reference-links-bot] [skip ci]"
          git push
