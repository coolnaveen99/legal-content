name: Legal content enhancement bot

# STOPPED 2026-10-06. Chained next-topic and next-subject dispatch removed. Job is disabled.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject slug to process"
        required: true
      branch:
        description: "Existing enhancement branch; leave empty for a new dated branch"
        required: false
        default: ""
      topics_per_run:
        description: "Topics processed per trigger"
        required: false
        default: "1"
      dry_run:
        description: "Inventory only; do not modify content"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-enhancement-${{ github.event.inputs.subject || 'scheduled' }}
  cancel-in-progress: true

jobs:
  enhance:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legal content enhancement bot is stopped."
