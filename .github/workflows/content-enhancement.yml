name: Legal content enhancement bot

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject slug to process"
        required: true
      branch:
        description: "Existing enhancement branch; leave empty for a new dated branch"
        required: false
        default: ""
      topics_per_run:
        description: "Topics processed per trigger"
        required: false
        default: "1"
      dry_run:
        description: "Inventory only; do not modify content"
        required: false
        default: "false"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-enhancement-${{ github.event.inputs.subject || 'scheduled' }}
  cancel-in-progress: false

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested branch or main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve subject for scheduled run
        id: subject
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.subject }}" ]; then
            echo "subject=${{ github.event.inputs.subject }}" >> "$GITHUB_OUTPUT"
          else
            node - <<'NODE'
            const fs=require('fs');
            const p='topics';
            const set=new Set();
            function walk(d){if(!fs.existsSync(d))return;for(const e of fs.readdirSync(d,{withFileTypes:true})){const x=d+'/'+e.name;if(e.isDirectory())walk(x);else if(e.name.endsWith('.json')){try{const j=JSON.parse(fs.readFileSync(x));if(j.entityType==='topic'&&j.content?.legacySubjectSlug)set.add(j.content.legacySubjectSlug)}catch{}}}}
            walk(p);
            console.log('subject='+[...set].sort()[0]);
            NODE
          fi

      - name: Create dated subject branch
        id: branch
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            SUBJECT="${{ steps.subject.outputs.subject }}"
            BRANCH="content-enhancement-${SUBJECT}-$(date -u +%Y-%m-%d)"
            git checkout -B "$BRANCH"
            git push -u origin "$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run enhancement
        env:
          ENHANCEMENT_SUBJECT: ${{ steps.subject.outputs.subject }}
          ENHANCEMENT_BRANCH: ${{ steps.branch.outputs.branch }}
          ENHANCEMENT_TOPICS_PER_RUN: ${{ github.event.inputs.topics_per_run || '1' }}
          ENHANCEMENT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          ENHANCEMENT_PROVIDER_URL: ${{ secrets.ENHANCEMENT_PROVIDER_URL }}
          ENHANCEMENT_PROVIDER_TOKEN: ${{ secrets.ENHANCEMENT_PROVIDER_TOKEN }}
        run: node scripts/content-enhancement-bot.mjs

      - name: Validate enhanced content
        run: |
          npm install
          npm run validate:enhancements
          npm run validate
          npm run manifest:refresh

      - name: Commit topic enhancement
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          git config user.name "codepackr-content-enhancement-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics .content-enhancement-state manifests/content-manifest.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(content): enhance topic and illustrations"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Trigger next topic
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run content-enhancement.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ steps.branch.outputs.branch }}" \
            -f subject="${{ steps.subject.outputs.subject }}" \
            -f branch="${{ steps.branch.outputs.branch }}" \
            -f topics_per_run="1"

      - name: Note
        run: echo "One-topic-at-a-time enhancement cycle completed. The next trigger continues the same subject branch."
