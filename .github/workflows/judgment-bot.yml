name: Judgment ingestion bot

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Maximum judgments to inspect"
        required: false
        default: "20"
      dry_run:
        description: "Discover and validate without writing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: judgment-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Discover and ingest
        env:
          JUDGMENT_BOT_MAX: ${{ github.event.inputs.max || '20' }}
          JUDGMENT_BOT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/judgment-bot.mjs
      - name: Verify judgment records
        run: node scripts/verify-judgment-bot.mjs
      - name: Refresh manifest
        run: npm run manifest:refresh
      - name: Repository validation
        run: npm run validate
      - name: Enhancement validation
        run: npm run validate:enhancements
      - name: Commit to main
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "codepackr-judgment-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add judgments .judgment-bot-state.json manifests/content-manifest.json
          if git diff --cached --quiet; then
            echo "No new judgment records."
            exit 0
          fi
          git commit -m "chore(judgments): ingest court judgments"
          git push origin main
