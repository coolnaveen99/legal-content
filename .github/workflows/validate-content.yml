name: validate-content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh manifest from entity files
        run: node scripts/refresh-manifest.mjs

      - name: Validate schemas, entities, relationships, manifest
        run: node scripts/validate.mjs --graph-report

      - name: Relationship unit tests (PIL pilot)
        run: node scripts/test-relationships.mjs

      - name: Build relationship index (adjacency aid)
        run: node scripts/build-relationship-index.mjs
