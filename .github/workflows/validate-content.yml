name: validate-content

on:
  workflow_dispatch:
    inputs:
      restore_legacy:
        description: "Restore the immutable legacy baseline before validation"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout legacy codepackr-law content
        if: github.event_name == 'workflow_dispatch' && inputs.restore_legacy == true
        uses: actions/checkout@v4
        with:
          repository: coolnaveen99/codepackr-law
          ref: main
          path: codepackr-law
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore all legacy topic content from codepackr-law
        if: github.event_name == 'workflow_dispatch' && inputs.restore_legacy == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_CONTENT_ROOT: ${{ github.workspace }}/codepackr-law
          ALLOW_DESTRUCTIVE_LEGACY_RESTORE: "1"
        run: node scripts/migrate-legacy-topics.mjs

      - name: Persist restored legacy topic content
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.restore_legacy == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics manifests/legacy-topic-migration.json
          if git diff --staged --quiet; then
            echo "No restored legacy content changes to persist"
          else
            git commit -m "chore: restore complete legacy topic content [skip ci]"
            git push
          fi

      - name: Regenerate full manifest from entity files
        run: node scripts/refresh-manifest.mjs

      - name: Build relationship index
        run: node scripts/build-relationship-index.mjs

      - name: Verify legacy content preservation baseline
        run: node scripts/verify-legacy-preservation.mjs

      - name: Phase 2 canonical content quality audit
        run: node scripts/audit-migrated-topics.mjs

      - name: Phase 3 source and legal provenance audit
        run: node scripts/audit-provenance.mjs

      - name: Phase 3B topic-to-source verification
        run: node scripts/verify-topic-provenance.mjs

      - name: Phase 5 current-law metadata normalization
        run: node scripts/apply-current-law-metadata.mjs

      - name: Phase 4 legal proposition and case-law verification audit
        run: node scripts/audit-legal-propositions.mjs

      - name: Phase 6 statutory section and reference consistency audit
        run: node scripts/audit-statutory-consistency.mjs

      - name: Phase 7 statutory provision deep verification
        run: node scripts/audit-statutory-deep-verification.mjs

      - name: Phase 8 judgment and case-law verification
        run: node scripts/audit-judgment-case-law.mjs

      - name: Phase 9 canonical judgment registry
        run: node scripts/build-judgment-registry.mjs

      - name: Phase 10 authoritative judgment verification audit
        run: node scripts/audit-authoritative-judgment-verification.mjs

      - name: Phase 11 proposition-level case-law enrichment
        run: node scripts/audit-proposition-level-case-law.mjs

      - name: Phase 13 final acceptance readiness audit
        run: node scripts/audit-final-acceptance-readiness.mjs

      - name: Validate student content enhancements
        run: node scripts/validate-enhancements.mjs

      - name: Report full-catalog enhancement progress
        run: node scripts/report-enhancement-progress.mjs

      - name: Validate schemas, entities, relationships, manifest
        run: node scripts/validate.mjs --graph-report

      - name: Relationship unit tests (PIL pilot)
        run: node scripts/test-relationships.mjs

      - name: Commit regenerated content on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics manifests/content-manifest.json manifests/relationship-index.json manifests/legacy-topic-migration.json manifests/phase-2-quality-audit.json manifests/phase-3-provenance-audit.json manifests/phase-3b-topic-verification.json manifests/phase-4-legal-verification.json manifests/phase-6-statutory-verification.json manifests/phase-7-statutory-deep-verification.json manifests/phase-8-judgment-verification.json manifests/phase-9-judgment-registry.json manifests/phase-10-authoritative-judgment-verification.json manifests/phase-11-proposition-verification.json manifests/phase-12-judgment-completeness.json manifests/phase-13-final-acceptance-readiness.json judgments
          if git diff --staged --quiet; then
            echo "No generated content changes to commit"
          else
            git commit -m "chore: persist Phase 11-13 acceptance verification [skip ci]"
            git push
          fi
