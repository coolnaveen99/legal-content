name: Subject content bots

# STOPPED 2026-10-06. Schedule and self-dispatch removed. Job is disabled.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: Subject slug; blank continues the next incomplete subject
        required: false
        default: ""
      topics_per_run:
        description: Topics this run. One topic then the next run starts.
        required: false
        default: "1"
      dry_run:
        description: Inventory only
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: subject-content-bots
  cancel-in-progress: true

jobs:
  enhance:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo "Subject content bots are stopped."
