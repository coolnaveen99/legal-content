name: Subject content bots

on:
  workflow_dispatch:
    inputs:
      subject:
        description: Subject slug; blank runs every subject as its own job
        required: false
        default: ""
      topics_per_run:
        description: Topics per subject job
        required: false
        default: "3"
      dry_run:
        description: Inventory only
        required: false
        default: "false"
  schedule:
    - cron: "15 18 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  enhance:
    name: bot-${{ matrix.subject }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        subject: [admin, arbitration, bns, bnss, bsa, company, constitution, contract, cpc, cyber, dpsp, environment, ethics, family, fundamental-rights, ipr, labour, land, limitation, ni-act, petition-formats, pil, registration, sra, taxation, tort, torts, tpa]
    concurrency:
      group: subject-bot-${{ matrix.subject }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if a specific subject was requested
        id: gate
        run: |
          WANTED="${{ github.event.inputs.subject }}"
          if [ -n "$WANTED" ] && [ "$WANTED" != "${{ matrix.subject }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use subject branch
        if: steps.gate.outputs.run == 'true'
        id: branch
        run: |
          BRANCH="subject-bot-${{ matrix.subject }}"
          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Enhance subject
        if: steps.gate.outputs.run == 'true'
        env:
          SUBJECT_BOT_SUBJECT: ${{ matrix.subject }}
          SUBJECT_BOT_TOPICS_PER_RUN: ${{ github.event.inputs.topics_per_run || '3' }}
          SUBJECT_BOT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/subject-content-bot.mjs
      - name: Validate
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          npm run manifest:refresh
          npm run validate:enhancements
          npm run validate
      - name: Commit subject branch
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "codepackr-subject-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics illustrations .subject-content-bot-state manifests/content-manifest.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(${{ matrix.subject }}): add educational examples and illustrations"
          git push -u origin "${{ steps.branch.outputs.branch }}"
      - name: Open review PR
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "Branch matches main."
            exit 0
          fi
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "subject-bot-${{ matrix.subject }}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "subject-bot-${{ matrix.subject }}" --base main --title "Subject bot — ${{ matrix.subject }}" --body "Non-AI subject bot. Adds educational examples and illustration entities from text already stored on each topic. Does not invent cases or citations."
          else
            echo "Open PR #$EXISTING"
          fi
